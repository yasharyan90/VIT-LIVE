name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: devpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./... -count=1
        env:
          TEST_PG_ADMIN_URL: postgres://postgres:devpass@localhost:5432/postgres?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:devpass@localhost:5432/vitlive_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/15
      - name: Build
        working-directory: backend
        run: go build ./...

  student-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-app/package-lock.json
      - name: Install
        working-directory: student-app
        run: npm ci
      - name: Lint
        working-directory: student-app
        run: npm run lint
      - name: Build (typecheck + bundle)
        working-directory: student-app
        run: npm run build

  admin-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: Install
        working-directory: admin-dashboard
        run: npm ci
      - name: Lint
        working-directory: admin-dashboard
        run: npm run lint
      - name: Build (typecheck + bundle)
        working-directory: admin-dashboard
        run: npm run build
